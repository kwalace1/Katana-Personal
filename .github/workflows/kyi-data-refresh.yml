# Scheduled + manual KYI pipeline: fetch public data -> import into Supabase (dedup by name).
#
# 36 sources across SEC EDGAR, FEC, FINRA, USPTO, OpenCorporates, Companies House,
# SEDAR+, Senate/House lobbying, GDELT news, press releases, and more.
#
# Required repo secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
# Optional: FEC_API_KEY, GH_PAT, COMPANIES_HOUSE_API_KEY, SUPABASE_SERVICE_ROLE_KEY.

name: KYI Data Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyi-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch fresh data from public APIs (36 sources)
        run: npm run kyi:fetch-data
        timeout-minutes: 20
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}

      - name: Import into Supabase (dedup by name)
        run: npm run kyi:import-data
        timeout-minutes: 10
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
